<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NextTalk Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg:        #080b14;
    --surface:   #0e1320;
    --surface2:  #141926;
    --border:    rgba(99,179,237,0.12);
    --accent:    #63b3ed;
    --accent2:   #9f7aea;
    --accent3:   #68d391;
    --danger:    #fc8181;
    --warn:      #f6ad55;
    --text:      #e2e8f0;
    --muted:     #4a5568;
    --muted2:    #718096;
    --glow:      0 0 24px rgba(99,179,237,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 0;
  }
  .sidebar-logo {
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text { font-size: 15px; font-weight: 800; letter-spacing: -.3px; color: #fff; }
  .logo-badge { font-size: 9px; color: var(--accent); font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; margin-top: 1px; }

  .nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
  .nav-section { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; padding: 10px 12px 6px; font-family: 'JetBrains Mono', monospace; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 9px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--muted2);
    transition: all .15s; margin-bottom: 2px; border: 1px solid transparent;
  }
  .nav-item:hover { background: rgba(99,179,237,0.06); color: var(--text); }
  .nav-item.active { background: rgba(99,179,237,0.1); color: var(--accent); border-color: rgba(99,179,237,0.2); }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; }

  .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
  .admin-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--surface2); border-radius: 10px;
    border: 1px solid var(--border);
  }
  .admin-avatar { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#fc8181,#9f7aea); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .admin-info p { font-size: 12px; font-weight: 700; color: #fff; }
  .admin-info span { font-size: 10px; color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    height: 56px; flex-shrink: 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .page-title { font-size: 18px; font-weight: 800; color: #fff; }
  .page-sub { font-size: 12px; color: var(--muted2); font-family: 'JetBrains Mono', monospace; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent3); box-shadow: 0 0 8px var(--accent3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.9)} }
  .status-label { font-size: 11px; color: var(--accent3); font-family: 'JetBrains Mono', monospace; }

  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* ── Cards ── */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px;
    position: relative; overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }
  .stat-card:hover { border-color: rgba(99,179,237,0.3); box-shadow: var(--glow); }
  .stat-card::before { content:''; position:absolute; top:0; right:0; width:80px; height:80px; border-radius:50%; opacity:.06; transform:translate(20px,-20px); }
  .stat-card.blue::before { background: var(--accent); }
  .stat-card.purple::before { background: var(--accent2); }
  .stat-card.green::before { background: var(--accent3); }
  .stat-card.red::before { background: var(--danger); }
  .stat-card.orange::before { background: var(--warn); }
  .stat-icon { font-size: 22px; margin-bottom: 10px; }
  .stat-val { font-size: 28px; font-weight: 800; color: #fff; font-family: 'JetBrains Mono', monospace; line-height: 1; }
  .stat-label { font-size: 12px; color: var(--muted2); margin-top: 4px; }
  .stat-trend { font-size: 11px; color: var(--accent3); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

  /* ── Tables ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; margin-bottom: 20px;
  }
  .card-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title { font-size: 14px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
  .card-count { font-size: 11px; color: var(--accent); background: rgba(99,179,237,0.1); padding: 2px 8px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; }
  .card-actions { display: flex; gap: 8px; }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 12px;
  }
  .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; font-family: 'Syne', sans-serif; width: 180px; }
  .search-box input::placeholder { color: var(--muted); }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 10px; color: var(--muted); letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); background: var(--surface2); }
  td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .user-cell { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .avatar-placeholder { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
  .user-name { font-weight: 600; color: #fff; font-size: 13px; }
  .user-phone { font-size: 11px; color: var(--muted2); font-family: 'JetBrains Mono', monospace; }

  /* ── Badges ── */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .badge-green { background: rgba(104,211,145,0.12); color: var(--accent3); border: 1px solid rgba(104,211,145,0.2); }
  .badge-gray { background: rgba(113,128,150,0.15); color: var(--muted2); border: 1px solid rgba(113,128,150,0.2); }
  .badge-red { background: rgba(252,129,129,0.12); color: var(--danger); border: 1px solid rgba(252,129,129,0.2); }
  .badge-blue { background: rgba(99,179,237,0.12); color: var(--accent); border: 1px solid rgba(99,179,237,0.2); }
  .badge-orange { background: rgba(246,173,85,0.12); color: var(--warn); border: 1px solid rgba(246,173,85,0.2); }
  .badge-purple { background: rgba(159,122,234,0.12); color: var(--accent2); border: 1px solid rgba(159,122,234,0.2); }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: all .15s; font-family: 'Syne', sans-serif; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-primary { background: rgba(99,179,237,0.15); color: var(--accent); border-color: rgba(99,179,237,0.3); }
  .btn-primary:hover { background: rgba(99,179,237,0.25); }
  .btn-danger { background: rgba(252,129,129,0.12); color: var(--danger); border-color: rgba(252,129,129,0.25); }
  .btn-danger:hover { background: rgba(252,129,129,0.22); }
  .btn-warn { background: rgba(246,173,85,0.12); color: var(--warn); border-color: rgba(246,173,85,0.25); }
  .btn-warn:hover { background: rgba(246,173,85,0.22); }
  .btn-ghost { background: var(--surface2); color: var(--muted2); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); }

  /* ── Modal ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; animation: fadeIn .15s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px; width:100%; max-width:480px; box-shadow: 0 24px 60px rgba(0,0,0,.6); animation: slideUp .2s; }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .modal-title { font-size: 17px; font-weight: 800; color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .modal-sub { font-size: 13px; color: var(--muted2); margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }

  /* ── Login ── */
  #login-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:99999; }
  .login-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:36px; width:360px; text-align:center; }
  .login-logo { font-size:40px; margin-bottom:16px; }
  .login-title { font-size:22px; font-weight:800; color:#fff; margin-bottom:6px; }
  .login-sub { font-size:13px; color:var(--muted2); margin-bottom:28px; font-family:'JetBrains Mono',monospace; }
  .login-input { width:100%; padding:12px 16px; background:var(--surface2); border:1px solid var(--border); border-radius:11px; color:var(--text); font-size:14px; outline:none; margin-bottom:12px; font-family:'Syne',sans-serif; transition:border-color .15s; }
  .login-input:focus { border-color:rgba(99,179,237,.5); }
  .login-btn { width:100%; padding:13px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:11px; color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:'Syne',sans-serif; transition:opacity .15s; }
  .login-btn:hover { opacity:.9; }
  .login-error { color:var(--danger); font-size:12px; margin-top:8px; }

  /* ── Encryption section ── */
  .enc-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .enc-card { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:18px; }
  .enc-card h4 { font-size:13px; font-weight:700; color:#fff; margin-bottom:8px; display:flex; align-items:center; gap:7px; }
  .enc-card p { font-size:12px; color:var(--muted2); line-height:1.6; }
  .enc-status { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11px; color:var(--accent3); font-family:'JetBrains Mono',monospace; }

  /* ── Chatbot Config ── */
  .kb-item { background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:flex-start; gap:12px; }
  .kb-keywords { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .kb-kw { background:rgba(99,179,237,.1); color:var(--accent); font-size:10px; padding:2px 7px; border-radius:20px; font-family:'JetBrains Mono',monospace; border:1px solid rgba(99,179,237,.2); }
  .kb-response-preview { font-size:12px; color:var(--muted2); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:400px; }
  .kb-number { width:28px; height:28px; border-radius:8px; background:rgba(99,179,237,.1); border:1px solid rgba(99,179,237,.2); color:var(--accent); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'JetBrains Mono',monospace; }

  textarea.form-input, input.form-input, select.form-input {
    width:100%; padding:10px 13px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:13px; outline:none; font-family:'Syne',sans-serif; resize:vertical; transition:border-color .15s;
  }
  textarea.form-input:focus, input.form-input:focus { border-color:rgba(99,179,237,.4); }
  label.form-label { font-size:11px; color:var(--muted2); letter-spacing:.5px; display:block; margin-bottom:5px; font-family:'JetBrains Mono',monospace; }
  .form-group { margin-bottom:14px; }

  .empty-state { text-align:center; padding:48px 24px; color:var(--muted); }
  .empty-state .icon { font-size:40px; margin-bottom:12px; }
  .empty-state p { font-size:14px; }

  .loading { text-align:center; padding:40px; color:var(--muted2); font-family:'JetBrains Mono',monospace; font-size:13px; }
  .dot-anim::after { content:'...'; animation:dots 1.2s infinite; }
  @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

  .toast { position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; z-index:99999; box-shadow:0 8px 30px rgba(0,0,0,.4); animation:slideUp .2s; }
  .toast.success { border-color:rgba(104,211,145,.3); color:var(--accent3); }
  .toast.error { border-color:rgba(252,129,129,.3); color:var(--danger); }

  .member-list { display:flex; flex-direction:column; gap:8px; }
  .member-row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface2); border-radius:10px; border:1px solid var(--border); }
  .member-row .info { flex:1; }
  .member-row .info p { font-size:13px; font-weight:600; color:#fff; }
  .member-row .info span { font-size:11px; color:var(--muted2); font-family:'JetBrains Mono',monospace; }

  /* Chart bars */
  .chart-wrap { padding:16px 20px 8px; }
  .chart-bars { display:flex; align-items:flex-end; gap:6px; height:80px; }
  .chart-bar { flex:1; border-radius:4px 4px 0 0; background:rgba(99,179,237,.3); transition:background .15s; position:relative; min-width:0; }
  .chart-bar:hover { background:rgba(99,179,237,.6); }
  .chart-bar .tip { position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--accent); font-family:'JetBrains Mono',monospace; white-space:nowrap; opacity:0; transition:opacity .15s; }
  .chart-bar:hover .tip { opacity:1; }
  .chart-labels { display:flex; gap:6px; margin-top:6px; }
  .chart-label { flex:1; font-size:9px; color:var(--muted); text-align:center; font-family:'JetBrains Mono',monospace; overflow:hidden; }
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛡️</div>
    <div class="login-title">NextTalk Admin</div>
    <div class="login-sub">Panel de Control · v2.0</div>
    <input class="login-input" type="password" id="admin-key-input" placeholder="Clave de administrador" />
    <button class="login-btn" onclick="doLogin()">Acceder</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app" style="display:none">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🛡️</div>
      <div>
        <div class="logo-text">NextTalk</div>
        <div class="logo-badge">ADMIN PANEL</div>
      </div>
    </div>
    <div class="nav">
      <div class="nav-section">GENERAL</div>
      <div class="nav-item active" onclick="navigate('dashboard')" id="nav-dashboard">
        <span class="icon">📊</span> Dashboard
      </div>
      <div class="nav-section">GESTIÓN</div>
      <div class="nav-item" onclick="navigate('users')" id="nav-users">
        <span class="icon">👥</span> Usuarios
        <span class="nav-badge" id="badge-users">0</span>
      </div>
      <div class="nav-item" onclick="navigate('groups')" id="nav-groups">
        <span class="icon">💬</span> Grupos
        <span class="nav-badge" id="badge-groups" style="background:var(--accent2)">0</span>
      </div>
      <div class="nav-item" onclick="navigate('sanctions')" id="nav-sanctions">
        <span class="icon">⚠️</span> Sanciones
        <span class="nav-badge" id="badge-sanctions" style="background:var(--warn)">0</span>
      </div>
      <div class="nav-section">SISTEMA</div>
      <div class="nav-item" onclick="navigate('encryption')" id="nav-encryption">
        <span class="icon">🔐</span> Cifrado E2E
      </div>
      <div class="nav-item" onclick="navigate('chatbot')" id="nav-chatbot">
        <span class="icon">🤖</span> Chatbot IA
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="admin-chip">
        <div class="admin-avatar">A</div>
        <div class="admin-info">
          <p>Administrador</p>
          <span>ROOT ACCESS</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <div>
          <div class="page-title" id="page-title">Dashboard</div>
          <div class="page-sub" id="page-sub">Resumen general del sistema</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="status-dot"></div>
        <span class="status-label">SISTEMA ACTIVO</span>
        <button class="btn btn-ghost btn-sm" onclick="refreshAll()">↻ Actualizar</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading"><span class="dot-anim">Cargando</span></div>
    </div>
  </div>
</div>

<!-- Modal genérico -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display:none"></div>

<script>
const API = (localStorage.getItem('admin_api') || 'https://cr4j9v-5000.csb.app');
let ADMIN_KEY = '';
let currentPage = 'dashboard';
let allUsers = [];
let allGroups = [];
let stats = {};

// ── Chatbot KB (misma que AIChatbotView) ─────────────────────────────────────
let chatbotKB = JSON.parse(localStorage.getItem('admin_chatbot_kb') || 'null') || [
  { id: 1, keywords: ['cifrado','extremo a extremo','e2e','encriptación'], response: '🔒 **Cifrado extremo a extremo (E2E)**\n\nEl cifrado E2E garantiza que tus mensajes solo puedan leerlos tú y la persona con quien chateas.' },
  { id: 2, keywords: ['dos pasos','2fa','doble factor','otp','código'], response: '🔐 **Verificación en dos pasos (2FA)**\n\nEs una capa extra de seguridad que protege tu cuenta aunque alguien robe tu contraseña.' },
  { id: 3, keywords: ['privacidad','proteger','datos personales'], response: '🛡️ **Cómo proteger tu privacidad**\n\nUsa apps con cifrado E2E, activa 2FA y revisa los permisos de la app.' },
  { id: 4, keywords: ['contraseña','password','segura','clave'], response: '🔑 **Contraseñas seguras**\n\nUsa al menos 12 caracteres, combina letras, números y símbolos.' },
  { id: 5, keywords: ['spam','estafa','phishing','fraude','scam'], response: '⚠️ **Cómo evitar estafas**\n\nNunca hagas clic en enlaces de extraños. Bloquea y reporta contactos sospechosos.' },
  { id: 6, keywords: ['bloquear','reportar','denunciar'], response: '🚫 **Bloquear y reportar**\n\nToca ⋮ junto al chat y selecciona Bloquear o Reportar.' },
  { id: 7, keywords: ['grupo','crear grupo','miembros'], response: '👥 **Grupos en SecureChat**\n\nPuedes crear grupos para chatear con varias personas con cifrado E2E.' },
  { id: 8, keywords: ['wifi','vpn','red publica'], response: '📡 **Seguridad WiFi pública**\n\nUsa VPN en redes públicas. SecureChat cifra tus mensajes aunque estés en WiFi pública.' },
];

function saveKB() { localStorage.setItem('admin_chatbot_kb', JSON.stringify(chatbotKB)); }

// ── Auth ──────────────────────────────────────────────────────────────────────
function doLogin() {
  const key = document.getElementById('admin-key-input').value;
  if (!key) return;
  ADMIN_KEY = key;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  refreshAll();
}
document.getElementById('admin-key-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── API helper ────────────────────────────────────────────────────────────────
async function api(path, options = {}) {
  const res = await fetch(`${API}${path}`, {
    ...options,
    headers: { 'x-admin-key': ADMIN_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) },
    body: options.body ? (typeof options.body === 'string' ? options.body : JSON.stringify(options.body)) : undefined,
  });
  return res.json();
}

// ── Data loading ──────────────────────────────────────────────────────────────
async function refreshAll() {
  try {
    const [s, u, g] = await Promise.all([
      api('/api/admin/stats'),
      api('/api/admin/users'),
      api('/api/admin/groups'),
    ]);
    stats = s;
    allUsers = u.users || [];
    allGroups = g.groups || [];
    document.getElementById('badge-users').textContent = allUsers.length;
    document.getElementById('badge-groups').textContent = allGroups.length;
    render();
  } catch (err) {
    showToast('Error conectando al servidor', 'error');
    render();
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
const pages = { dashboard:'Dashboard', users:'Usuarios', groups:'Grupos', sanctions:'Sanciones', encryption:'Cifrado E2E', chatbot:'Chatbot IA' };
const subs = { dashboard:'Resumen general del sistema', users:'Control de cuentas registradas', groups:'Grupos y roles de miembros', sanctions:'Gestión de reportes y sanciones', encryption:'Estado del cifrado extremo a extremo', chatbot:'Configuración de respuestas del asistente' };

function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + page);
  if (nav) nav.classList.add('active');
  document.getElementById('page-title').textContent = pages[page] || page;
  document.getElementById('page-sub').textContent = subs[page] || '';
  render();
}

function render() {
  const el = document.getElementById('content');
  switch (currentPage) {
    case 'dashboard':   el.innerHTML = renderDashboard(); break;
    case 'users':       el.innerHTML = renderUsers(); break;
    case 'groups':      el.innerHTML = renderGroups(); break;
    case 'sanctions':   el.innerHTML = renderSanctions(); break;
    case 'encryption':  el.innerHTML = renderEncryption(); break;
    case 'chatbot':     el.innerHTML = renderChatbot(); break;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function avatarHtml(user, size=34) {
  const colors = ['#63b3ed','#9f7aea','#68d391','#fc8181','#f6ad55','#76e4f7'];
  const color = colors[(user.name||user.phone||'').charCodeAt(0) % colors.length];
  const initials = (user.name||user.phone||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  if (user.avatar) return `<img class="avatar" src="${user.avatar}" style="width:${size}px;height:${size}px;border-radius:10px" onerror="this.style.display='none'"/>`;
  return `<div class="avatar-placeholder" style="width:${size}px;height:${size}px;background:${color}22;border:1px solid ${color}44;color:${color};font-size:${size>34?15:12}px">${initials}</div>`;
}
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  const now = new Date();
  const diff = (now - dt) / 1000;
  if (diff < 60) return 'Ahora mismo';
  if (diff < 3600) return `Hace ${Math.floor(diff/60)}m`;
  if (diff < 86400) return `Hace ${Math.floor(diff/3600)}h`;
  return fmtDate(d);
}

    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-warn" style="flex:2" onclick="doAddSanction()">Aplicar sanción</button>
    </div>
  `);
}

function addSanction(userId, name) {
  const reasons = ['Spam o publicidad no deseada','Acoso o amenazas','Contenido inapropiado','Fraude o estafa','Suplantación de identidad','Violación de términos de uso'];
  const opts = reasons.map(r => `<option>${r}</option>`).join('');
  showModal(`
    <div class="modal-title">⚠️ Sancionar a ${name}</div>
    <div class="modal-sub">Selecciona el motivo. Con 2 sanciones la cuenta se elimina automáticamente.</div>
    <div class="form-group">
      <label class="form-label">MOTIVO</label>
      <select class="form-input" id="sanction-reason-direct">${opts}</select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-warn" style="flex:2" onclick="applyDirectSanction('${userId}')">Aplicar sanción</button>
    </div>
  `);
}

function applyDirectSanction(userId) {
  const reason = document.getElementById('sanction-reason-direct')?.value || 'Violación de normas';
  closeModal();
  applySanction(userId, reason);
}

function doAddSanction() {
  const userId = document.getElementById('sanction-user')?.value;
  const reason = document.getElementById('sanction-reason')?.value || 'Violación de normas';
  closeModal();
  if (userId) applySanction(userId, reason);
}

async function applySanction(userId, reason) {
  if (!localSanctions[userId]) localSanctions[userId] = { count: 0, reasons: [], date: new Date() };
  localSanctions[userId].count++;
  localSanctions[userId].reasons.push(reason);
  localSanctions[userId].date = new Date();
  localStorage.setItem('admin_sanctions', JSON.stringify(localSanctions));

  if (localSanctions[userId].count >= 2) {
    try {
      await api(`/api/admin/users/${userId}`, { method: 'DELETE' });
      allUsers = allUsers.filter(u => u._id !== userId);
      delete localSanctions[userId];
      localStorage.setItem('admin_sanctions', JSON.stringify(localSanctions));
      showToast('⚠️ Cuenta eliminada por 2 sanciones', 'error');
    } catch { showToast('Sanción aplicada (error al eliminar del servidor)', 'error'); }
  } else {
    showToast(`Sanción ${localSanctions[userId].count}/2 aplicada`, 'success');
  }
  render();
}

function removeSanctions(userId) {
  delete localSanctions[userId];
  localStorage.setItem('admin_sanctions', JSON.stringify(localSanctions));
  render();
  showToast('Sanciones eliminadas', 'success');
}

// ── Chatbot ───────────────────────────────────────────────────────────────────
function renderChatbot() {
  return `
  <div style="display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start">
    <div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">🤖 Base de conocimiento <span class="card-count">${chatbotKB.length} entradas</span></span>
          <button class="btn btn-sm btn-primary" onclick="showAddKBModal()">+ Agregar</button>
        </div>
        <div style="padding:14px 16px">
          ${chatbotKB.map((entry, i) => `
          <div class="kb-item">
            <div class="kb-number">${i+1}</div>
            <div style="flex:1;min-width:0">
              <div class="kb-keywords">
                ${entry.keywords.map(k => `<span class="kb-kw">${k}</span>`).join('')}
              </div>
              <div class="kb-response-preview">${entry.response.replace(/\*\*/g,'').replace(/\n/g,' ')}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:5px">
              <button class="btn btn-sm btn-ghost" onclick="showEditKBModal(${entry.id})">Editar</button>
              <button class="btn btn-sm btn-danger" onclick="deleteKBEntry(${entry.id})">Borrar</button>
            </div>
          </div>`).join('')}
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-header"><span class="card-title">📊 Estadísticas del chatbot</span></div>
        <div style="padding:14px 16px">
          ${[
            ['Total de respuestas','🎯',chatbotKB.length,'blue'],
            ['Palabras clave totales','🔑',chatbotKB.reduce((s,e)=>s+e.keywords.length,0),'purple'],
            ['Respuestas genéricas','💭',3,'gray'],
          ].map(([label,icon,val,c]) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:13px;color:var(--muted2)">${icon} ${label}</span>
            <span class="badge badge-${c}">${val}</span>
          </div>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">⚙️ Configuración</span></div>
        <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
          ${[
            ['Delay mínimo','500ms'],
            ['Delay máximo','2000ms'],
            ['Normalización acentos','Activo'],
            ['Coincidencia parcial','Activo'],
            ['Respuestas genéricas','3 disponibles'],
          ].map(([k,v]) => `
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
            <span style="color:var(--muted2)">${k}</span>
            <span style="color:#fff;font-family:JetBrains Mono,monospace">${v}</span>
          </div>`).join('')}
          <div style="margin-top:6px;padding:10px;background:rgba(99,179,237,.06);border:1px solid rgba(99,179,237,.15);border-radius:8px">
            <p style="font-size:11px;color:var(--muted2);line-height:1.5">Los cambios se sincronizan automáticamente con la app. Recarga la vista del chatbot para ver los cambios.</p>

function showAddKBModal() {
  showModal(`
    <div class="modal-title">➕ Nueva respuesta del chatbot</div>
    <div class="modal-sub">Define las palabras clave que activarán esta respuesta (separadas por comas) y el texto de respuesta.</div>
    <div class="form-group">
      <label class="form-label">PALABRAS CLAVE (separadas por comas)</label>
      <input class="form-input" id="kb-keywords" placeholder="ej: contraseña, password, clave, pin" />
    </div>
    <div class="form-group">
      <label class="form-label">RESPUESTA (soporta **negrita** y saltos de línea)</label>
      <textarea class="form-input" id="kb-response" rows="5" placeholder="🔑 **Título**\n\nEscribe aquí la respuesta..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveNewKBEntry()">Guardar</button>
    </div>
  `);
}

function saveNewKBEntry() {
  const keywords = (document.getElementById('kb-keywords')?.value || '').split(',').map(s=>s.trim()).filter(Boolean);
  const response = document.getElementById('kb-response')?.value || '';
  if (!keywords.length || !response.trim()) { showToast('Completa todos los campos', 'error'); return; }
  const id = Date.now();
  chatbotKB.push({ id, keywords, response });
  saveKB();
  closeModal();
  render();
  showToast('Respuesta agregada al chatbot', 'success');
}

function showEditKBModal(id) {
  const entry = chatbotKB.find(e => e.id === id);
  if (!entry) return;
  showModal(`
    <div class="modal-title">✏️ Editar respuesta</div>
    <div class="form-group">
      <label class="form-label">PALABRAS CLAVE</label>
      <input class="form-input" id="kb-edit-keywords" value="${entry.keywords.join(', ')}" />
    </div>
    <div class="form-group">
      <label class="form-label">RESPUESTA</label>
      <textarea class="form-input" id="kb-edit-response" rows="5">${entry.response}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:2" onclick="saveEditKBEntry(${id})">Guardar cambios</button>
    </div>
  `);
}

function saveEditKBEntry(id) {
  const keywords = (document.getElementById('kb-edit-keywords')?.value || '').split(',').map(s=>s.trim()).filter(Boolean);
  const response = document.getElementById('kb-edit-response')?.value || '';
  if (!keywords.length || !response.trim()) { showToast('Completa todos los campos', 'error'); return; }
  const idx = chatbotKB.findIndex(e => e.id === id);
  if (idx >= 0) { chatbotKB[idx].keywords = keywords; chatbotKB[idx].response = response; }
  saveKB();
  closeModal();
  render();
  showToast('Respuesta actualizada', 'success');
}

function deleteKBEntry(id) {
  chatbotKB = chatbotKB.filter(e => e.id !== id);
  saveKB();
  render();
  showToast('Entrada eliminada', 'success');
}

// ── Modal helpers ─────────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal-inner').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').style.display = 'none';
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
  t.className = `toast ${type}`;
  t.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3000);
}
</script>
